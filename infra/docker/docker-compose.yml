name: church-page

# Local development: one container runs the full Turborepo (`pnpm dev`).
# Production uses separate Dockerfile.web / Dockerfile.api — turbo runs in CI only.

services:
  dev:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.dev
    init: true
    tty: true
    stdin_open: true
    ports:
      - "${WEB_PORT:-5173}:5173"
      - "${API_PORT:-8080}:8080"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      TURBO_TELEMETRY_DISABLED: "1"
      PORT: "8080"
      ENV: development
      CORS_ORIGINS: "http://localhost:5173"
    volumes:
      - ../..:/app
      - church_node_modules:/app/node_modules
      - go_mod_cache:/go/pkg/mod
    entrypoint: ["/app/infra/docker/entrypoint.sh"]
    command: ["pnpm", "dev"]
    develop:
      watch:
        - action: sync
          path: ../..
          target: /app
          ignore:
            - node_modules/
            - "**/node_modules/"
            - .git/
            - .turbo/
            - dist/
            - bin/
        - action: rebuild
          path: ../../package.json
        - action: sync+restart
          path: ../../pnpm-lock.yaml
          target: /app/pnpm-lock.yaml

volumes:
  church_node_modules:
  go_mod_cache:
