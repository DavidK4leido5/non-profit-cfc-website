name: church-page

services:
  dev:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.dev
    init: true
    tty: true
    stdin_open: true
    ports:
      - "${WEB_PORT:-5173}:5173"
      - "${AUTH_PORT:-3001}:3001"
      - "${API_PORT:-8080}:8080"
    environment:
      # Reliable file watching when source is bind-mounted from Windows/macOS
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      TURBO_TELEMETRY_DISABLED: "1"
    volumes:
      # Source code from host; dependencies only in the named volume below
      - ../..:/app
      - church_node_modules:/app/node_modules
    entrypoint: ["/app/infra/docker/entrypoint.sh"]
    command: ["pnpm", "dev"]
    develop:
      watch:
        - action: sync
          path: ../..
          target: /app
          ignore:
            - node_modules/
            - "**/node_modules/"
            - .git/
            - .turbo/
            - dist/
            - bin/
        - action: rebuild
          path: ../../package.json
        - action: sync+restart
          path: ../../pnpm-lock.yaml
          target: /app/pnpm-lock.yaml

volumes:
  church_node_modules:
