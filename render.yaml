# Render Blueprint — free static site for @church/web (Turborepo monorepo)
# Connect repo: https://dashboard.render.com → New → Blueprint → this repo
services:
  - type: web
    name: cfc-church-web
    runtime: static
    plan: free
    branch: master
    buildCommand: >-
      corepack enable &&
      corepack prepare pnpm@11.17.0 --activate &&
      pnpm install --frozen-lockfile &&
      pnpm exec turbo run build --filter=@church/web
    staticPublishPath: apps/web/dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
