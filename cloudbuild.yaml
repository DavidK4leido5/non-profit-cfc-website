# Production images are built here (GCP), not on laptops.
# GitHub Actions only submits this file: `gcloud builds submit --config cloudbuild.yaml`
timeout: 3600s
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

substitutions:
  _REGION: asia-southeast1
  _AR_REPO: church
  _CLOUDINARY_CLOUD_NAME: ""

steps:
  - id: api-build
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/church-api:${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/church-api:latest
      - -f
      - apps/api/Dockerfile
      - .

  - id: auth-build
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - --target
      - runner
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/church-auth:${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/church-auth:latest
      - -f
      - apps/auth/Dockerfile
      - .

  - id: web-build
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - --target
      - runner
      - --build-arg
      - VITE_API_BASE_URL=/api/v1
      - --build-arg
      - VITE_AUTH_BASE_URL=/api/auth
      - --build-arg
      - VITE_CLOUDINARY_CLOUD_NAME=${_CLOUDINARY_CLOUD_NAME}
      - --build-arg
      - VITE_APP_NAME=Church
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/church-web:${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/church-web:latest
      - -f
      - apps/web/Dockerfile
      - .

  - id: api-push
    name: gcr.io/cloud-builders/docker
    waitFor: ["api-build"]
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/church-api

  - id: auth-push
    name: gcr.io/cloud-builders/docker
    waitFor: ["auth-build"]
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/church-auth

  - id: web-push
    name: gcr.io/cloud-builders/docker
    waitFor: ["web-build"]
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/church-web

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    waitFor: ["api-push", "auth-push", "web-push"]
    env:
      - GCP_PROJECT=$PROJECT_ID
      - GCP_REGION=$_REGION
      - AR_REPO=$_AR_REPO
      - CLOUDINARY_CLOUD_NAME=$_CLOUDINARY_CLOUD_NAME
      - VITE_CLOUDINARY_CLOUD_NAME=$_CLOUDINARY_CLOUD_NAME
    args:
      - ./scripts/deploy-cloud-run.sh
      - --ci
      - --skip-build
      - --skip-secrets
