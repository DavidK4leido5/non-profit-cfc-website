name: church-page

# Dev:  docker compose up --watch
# File sync: bind mounts (web + api). Watch restarts api on Go changes and rebuilds web on lockfile changes.
# `docker compose up -d` alone does NOT enable watch actions.

services:
  web:
    container_name: web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      target: dev
    ports:
      - "${WEB_PORT:-5173}:5173"
      - "${STORYBOOK_PORT:-6006}:6006"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "500"
      WATCHPACK_POLLING: "true"
      TURBO_TELEMETRY_DISABLED: "1"
      VITE_API_PROXY: http://api:8080
    volumes:
      - .:/app
      - church_node_modules:/app/node_modules
      # Host pnpm symlinks break inside the container — keep workspace node_modules in Docker only
      - /app/apps/web/node_modules
      - /app/packages/ui/node_modules
    depends_on:
      - api
    command: ["pnpm", "exec", "turbo", "run", "dev", "--filter=@church/web", "--filter=@church/ui"]
    develop:
      watch:
        - action: sync+restart
          path: ./pnpm-lock.yaml
          target: /app/pnpm-lock.yaml
        - action: sync+restart
          path: ./packages/ui/package.json
          target: /app/packages/ui/package.json
        - action: rebuild
          path: ./apps/web/Dockerfile

  api:
    container_name: api
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      ENV: development
      CORS_ORIGINS: "http://localhost:5173"
    volumes:
      - ./apps/api:/app/apps/api
      - go_mod_cache:/go/pkg/mod
    develop:
      watch:
        - action: sync+restart
          path: ./apps/api
          target: /app/apps/api
          ignore:
            - vendor/
            - bin/
        - action: rebuild
          path: ./apps/api/Dockerfile

volumes:
  church_node_modules:
  go_mod_cache:
