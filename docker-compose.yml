name: church-page

# Dev:  docker compose up --watch
# API: image rebuild on Go changes. Web: bind mount + Vite. Auth: Node Better Auth.
# Root `.env` is loaded for services.

services:
  web:
    container_name: web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      target: dev
    ports:
      - "${WEB_PORT:-5173}:5173"
      - "${STORYBOOK_PORT:-6006}:6006"
    env_file:
      - .env
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "500"
      WATCHPACK_POLLING: "true"
      TURBO_TELEMETRY_DISABLED: "1"
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
      VITE_AUTH_BASE_URL: ${VITE_AUTH_BASE_URL:-/api/auth}
      VITE_APP_NAME: ${VITE_APP_NAME:-Church}
      VITE_CLOUDINARY_CLOUD_NAME: ${VITE_CLOUDINARY_CLOUD_NAME:-}
      VITE_ADMIN_API_TOKEN: ${VITE_ADMIN_API_TOKEN:-}
      VITE_API_PROXY: http://api:8080
      VITE_AUTH_PROXY: http://auth:3001
    volumes:
      - .:/app
      - church_node_modules:/app/node_modules
      - /app/apps/web/node_modules
      - /app/packages/ui/node_modules
      - /app/apps/auth/node_modules
    depends_on:
      api:
        condition: service_healthy
      auth:
        condition: service_healthy
    command: ["pnpm", "exec", "turbo", "run", "dev", "--filter=@church/web", "--filter=@church/ui"]
    develop:
      watch:
        - action: sync+restart
          path: ./pnpm-lock.yaml
          target: /app/pnpm-lock.yaml
        - action: sync+restart
          path: ./packages/ui/package.json
          target: /app/packages/ui/package.json
        - action: rebuild
          path: ./apps/web/Dockerfile

  auth:
    container_name: auth
    build:
      context: .
      dockerfile: ./apps/auth/Dockerfile
      target: dev
    ports:
      - "${AUTH_PORT:-3001}:3001"
    env_file:
      - .env
    environment:
      AUTH_PORT: "3001"
      DATABASE_URL: ${DATABASE_URL:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:5173}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-Super Admin}
    volumes:
      - .:/app
      - church_node_modules:/app/node_modules
      - /app/apps/auth/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    develop:
      watch:
        - action: sync+restart
          path: ./apps/auth/package.json
          target: /app/apps/auth/package.json
        - action: rebuild
          path: ./apps/auth/Dockerfile

  api:
    container_name: api
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    ports:
      - "${API_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      PORT: "8080"
      ENV: ${ENV:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-church_session}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-dev-admin-token-change-me}
      MIGRATIONS_DIR: /app/apps/api/migrations
      DATABASE_URL: ${DATABASE_URL:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-church-dev}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    develop:
      watch:
        - action: rebuild
          path: ./apps/api
          ignore:
            - vendor/
            - bin/
            - docs/
        - action: rebuild
          path: ./apps/api/Dockerfile

volumes:
  church_node_modules:
