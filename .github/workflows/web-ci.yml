name: Web CI

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/ui/**"
      - "packages/typescript-config/**"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - "render.yaml"
      - "vercel.json"
      - "apps/web/Dockerfile"
      - "apps/web/nginx.conf"
  push:
    branches: [main, master]
    paths:
      - "apps/web/**"
      - "packages/ui/**"
      - "packages/typescript-config/**"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - "render.yaml"
      - "vercel.json"
      - "apps/web/Dockerfile"
      - "apps/web/nginx.conf"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck and build web
        run: pnpm exec turbo run typecheck build --filter=@church/web

      - name: Build production Docker image
        run: docker build -f apps/web/Dockerfile --target runner -t church-web:ci .
