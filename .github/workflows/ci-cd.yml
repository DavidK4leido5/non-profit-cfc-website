name: CI / CD

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: apps/api/go.sum

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck (web + auth + ui)
        run: pnpm exec turbo run typecheck --filter=@church/web --filter=@church/auth --filter=@church/ui

      - name: Build web (Vite production)
        run: pnpm exec turbo run build --filter=@church/web
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_AUTH_BASE_URL: /api/auth
          VITE_CLOUDINARY_CLOUD_NAME: ${{ vars.CLOUDINARY_CLOUD_NAME }}

      - name: Auth gateway self-check
        run: pnpm --filter @church/auth exec tsx src/gateway.selfcheck.ts

      - name: Go vet + unit tests (api)
        working-directory: apps/api
        run: |
          go vet -mod=vendor ./...
          go test -mod=vendor ./... -count=1

  deploy:
    name: Cloud Build → Cloud Run
    needs: check
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      GCP_PROJECT: cfc-g12
    steps:
      - uses: actions/checkout@v4

      - name: Check GCP credentials
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "::error::Add repository secret GCP_SA_KEY (JSON from bash scripts/setup-github-actions-sa.sh). GitHub only submits Cloud Build; images are built in GCP."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT }}
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Submit Cloud Build
        run: |
          gcloud builds submit \
            --project="${GCP_PROJECT}" \
            --config=cloudbuild.yaml \
            --substitutions="_CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}" \
            --timeout=3600s
        env:
          CLOUDINARY_CLOUD_NAME: ${{ vars.CLOUDINARY_CLOUD_NAME }}
